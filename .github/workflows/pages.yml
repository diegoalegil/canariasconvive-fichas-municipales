# Publica la carpeta web/ en GitHub Pages. El sitio es estático: no hay build,
# solo se sube tal cual lo que generan exportar_datos.py y exportar_geo.py.
# Antes corre la batería de pruebas (pruebas/): invariantes de los datos,
# interacciones en Chromium e impresión. Si algo falla, no se publica.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Invariantes de los datos
        run: python3 pruebas/invariantes.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Interacciones e impresión en Chromium
        run: npm run test:web
  desplegar:
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
        # 600000 ms (diez minutos) es el máximo que admite la acción. Si falla
        # con "multiple artifacts" o por tiempo, un commit nuevo arranca una
        # ejecución limpia; con "deployment in progress" hay que esperar a que
        # termine el anterior o cancelarlo en Settings › Environments.
        with:
          timeout: 600000
