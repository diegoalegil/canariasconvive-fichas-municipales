# Publica la carpeta web/ en GitHub Pages. El sitio es estático: no hay build,
# solo se sube tal cual lo que generan exportar_datos.py y exportar_geo.py.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
        # 600000 ms es el máximo que admite la acción: pedirle más no da más
        # margen, solo un aviso de que lo ha recortado. Diez minutos.
        #
        # Si un despliegue falla, NO se relanza desde la web de Actions: el
        # relanzamiento vuelve a ejecutar la subida del artefacto, se queda con
        # dos llamados "github-pages" en la misma ejecución y deploy-pages se
        # niega a elegir. Se arregla empujando un commit nuevo, que arranca una
        # ejecución limpia.
        with:
          timeout: 600000
