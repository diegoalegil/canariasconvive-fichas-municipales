# Publica la carpeta web/ en GitHub Pages. El sitio es estático: no hay build,
# solo se sube tal cual lo que generan los scripts de la raíz del repositorio.
# Antes corre la batería de pruebas (pruebas/) con los mismos comandos que
# package.json: pruebas de los datos (la conciliación con el Excel se omite
# porque el libro no está en el repositorio), interacciones en Chromium e
# impresión. Si algo falla, no se publica.
# Las acciones van fijadas por commit (la versión, en el comentario): una
# etiqueta como v4 puede moverse; un commit, no.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas de los datos
        run: npm run test:datos
      - run: npx playwright install --with-deps chromium
      - name: Interacciones e impresión en Chromium
        run: npm run test:web
  desplegar:
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        # 600000 ms (diez minutos) es el máximo que admite la acción. Si falla
        # con "multiple artifacts" o por tiempo, un commit nuevo arranca una
        # ejecución limpia; con "deployment in progress" hay que esperar a que
        # termine el anterior o cancelarlo en Settings › Environments.
        with:
          timeout: 600000
