# Publica la carpeta web/ en GitHub Pages. El sitio es estático: no hay build,
# solo se sube tal cual lo que generan los scripts de la raíz del repositorio.
# Antes corre la batería de pruebas (pruebas/) con los mismos comandos que
# package.json: pruebas de los datos (la conciliación con el Excel se omite
# porque el libro no está en el repositorio), interacciones en Chromium e
# impresión. Si algo falla, no se publica.
# Las acciones van fijadas por commit (la versión, en el comentario): una
# etiqueta como v4 puede moverse; un commit, no.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez, y el que está en curso se deja terminar: cancelarlo
# a medias dejaba el entorno github-pages colgado («deployment in progress»).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas de los datos
        run: npm run test:datos
      - run: npx playwright install --with-deps chromium
      - name: Interacciones e impresión en Chromium
        run: npm run test:web
  desplegar:
    needs: pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        # 600000 ms (diez minutos) es el máximo que admite la acción. Si falla
        # con "multiple artifacts" (un lanzamiento a mano y un push a la vez) o
        # por tiempo, un commit nuevo arranca una ejecución limpia; con
        # "deployment in progress" hay que esperar a que termine el anterior o
        # cancelarlo en Settings › Environments.
        with:
          timeout: 600000
