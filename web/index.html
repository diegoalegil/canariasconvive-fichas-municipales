<meta property="og:description" content="Una ficha por Canarias, cada provincia, cada isla y cada uno de los 88 municipios: estructura de la población, evolución desde 1996, lugar de nacimiento e índices. Población a 1 de enero de 2025.">

<link rel="stylesheet" href="estilos.css?v=104">

<body>

<main class="portada">
  <div class="tapa espera">

    <div class="tapa-alto ent">
      <!-- Los tres logotipos juntos, como en toda la web (Pedro). -->
      <div class="tapa-marca">
        <span class="placa">
          <img src="img/logo-canariasconvive.png" alt="Canarias Convive" data-logo="canariasconvive">
          <img src="img/logo-obiten.png" alt="OBITen" data-logo="obiten">
          <img src="img/logo-juntas.png" alt="Juntas en la misma dirección" data-logo="juntas">
        </span>
        <span>Fichas demográficas municipales</span>
      </div>
      <div class="tapa-cuerpo">
        <div class="tapa-texto ent">
          <h1>Una ficha por municipio, isla, provincia y para toda Canarias</h1>
        </div>
        <div class="tapa-datos" id="tapa-datos"></div>
      </div>
    </div>

    <div class="filtros">
      <div id="estado-portada" class="aviso-carga" role="status" aria-live="polite" hidden></div>
      <div class="buscador ent" data-ico="buscar">
        <label class="oculto" for="buscar">Buscar municipio, isla o provincia por nombre</label>
        <input type="search" id="buscar" placeholder="Buscar municipio, isla o provincia por nombre"
               autocomplete="off" role="combobox" aria-expanded="false"
               aria-controls="resultados" aria-autocomplete="list">
        <div class="desplegable" id="resultados" role="listbox"
             aria-label="Territorios encontrados" hidden></div>
      </div>
    </div>

    <!-- Canarias entera; después, bajo el rótulo de su provincia, una tarjeta por isla:
         cada una despliega la ficha de la isla entera y, debajo, la de cada municipio. -->
    <section class="archipielago" aria-label="Elegir un territorio">
      <a class="canarias-banda ent" id="banda-canarias" href="ficha.html?canarias"></a>
      <div class="islas-tarjetas" id="islas"></div>
    </section>

    <div class="atajos">
      <a class="btn btn-liso" href="guia.html" data-ico="dependencia">Cómo se lee</a>
      <a class="btn btn-liso" href="comparar.html" data-ico="relevo">Comparar</a>
      <a class="btn btn-liso" href="dossier.html" data-ico="descargar">Dossier de las 98 fichas</a>
    </div>

  </div>
</main>

<!-- Sin JavaScript la clase «espera» no se retiraría nunca: aquí se anula (y si un
     script no llega a cargar, comun.js la retira). -->
<noscript><style>.tapa.espera .ent { opacity: 1; }</style></noscript>
<script src="config.js?v=104"></script>
<script src="comun.js?v=104"></script>
<script src="iconos.js?v=104"></script>
<script src="portada.js?v=104"></script>
</body>
</html>
