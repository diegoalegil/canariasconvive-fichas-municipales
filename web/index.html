<body>

<main class="portada">
  <div class="tapa espera">

    <div class="tapa-alto ent">
      <div class="tapa-marca">
        <span class="placa"><img src="img/logo-canariasconvive.png" alt="Canarias Convive"></span>
        <span>Fichas demográficas municipales</span>
      </div>
      <div class="tapa-cuerpo">
        <div class="tapa-texto ent">
          <h1>Una ficha por cada municipio de Canarias</h1>
          <p id="tapa-anio"></p>
        </div>
        <div class="tapa-datos" id="tapa-datos"></div>
      </div>
    </div>

    <div class="filtros">
      <div class="buscador ent" data-ico="buscar">
        <label class="oculto" for="buscar">Buscar municipio por nombre</label>
        <input type="search" id="buscar" placeholder="Buscar municipio por nombre"
               autocomplete="off" role="combobox" aria-expanded="false"
               aria-controls="resultados" aria-autocomplete="list">
        <div class="desplegable" id="resultados" role="listbox"
             aria-label="Municipios encontrados" hidden></div>
      </div>
      <div class="islas" id="islas"><b>Por isla</b></div>
    </div>

    <div class="atajos">
      <a class="btn btn-liso" href="guia.html" data-ico="dependencia">Cómo se lee</a>
      <a class="btn btn-liso" href="comparar.html" data-ico="relevo">Comparar municipios</a>
      <a class="btn btn-liso" href="dossier.html" data-ico="descargar">Dossier de las 88</a>
    </div>

  </div>
</main>
